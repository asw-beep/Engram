# The whole stack on one machine (spec section 9). From the repository root:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Only Caddy publishes a port. It sends /api/* to the API and everything else to the web app.
name: engram-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://engram:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/engram
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env.prod}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      STORAGE_DIR: /data/files
      DOWNLOAD_DIR: /data/downloads
      HF_HOME: /models
      EMBEDDING_DEVICE: cpu
      # Task 2: batch 4 peaked at 2.6 GB on 2 CPUs. Torch otherwise starts one thread per
      # host core, not per CPU it may use.
      EMBEDDING_BATCH_SIZE: "4"
      OMP_NUM_THREADS: "2"
      # The reranker runs on the same CPU in full precision; small batches bound its memory.
      RERANKER_BATCH_SIZE: "4"
      PRELOAD_EMBEDDING_MODEL: "true"
    volumes:
      - models:/models
      - files:/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    # BGE-M3 and the reranker, each about 2.3 GB in full precision on the CPU, plus working
    # memory. 6g is an estimate, not a measurement: Phase 4 measures it and sizes the server,
    # since the caps now add up to more than the 8 GiB Phase 1 server (Phase 2 spec, section 10).
    mem_limit: 6g
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: engram
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 1536m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      # No port is published: only the API reaches it, on the Compose network. It holds a
      # projection that `reindex-keyword` rebuilds from PostgreSQL.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    # The heap is half the cap; the rest is for Lucene's file cache and the JVM itself.
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  postgres-data:
  qdrant-data:
  opensearch-data:
  files:
  # BGE-M3 (about 4 GB) and BGE-reranker-v2-m3 (about 2.2 GB). The first start downloads
  # them into this volume. On the laptop it is the volume Phase 1's Task 2 filled from the
  # local cache, so BGE-M3 isn't downloaded again; the reranker is, once.
  models:
    name: engram-hf
  caddy-data:
  caddy-config:
